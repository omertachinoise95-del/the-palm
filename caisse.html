<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>The Palm – Caisse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=Montserrat:wght@300;400;500;600;700&display=swap');
:root{--dark:#0f0d1a;--dark2:#1a1730;--gold:#b8965a;--gold-light:#d4aa6e;--purple:#6b3fa0;--green:#27ae60;--red:#e74c3c;--border:rgba(184,150,90,0.18);--card:rgba(255,255,255,0.04)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Montserrat',sans-serif;background:var(--dark);color:white;min-height:100vh;overflow-x:hidden}

/* LOGIN */
#view-login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0d0b18,#3a1f6b)}
#view-login.active{display:flex}
.login-box{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:24px;padding:52px 44px;max-width:380px;width:100%;margin:20px;text-align:center}
.login-logo{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:6px;color:var(--gold);margin-bottom:6px}
.login-box h2{font-family:'Cormorant Garamond',serif;color:white;font-size:34px;font-weight:300;letter-spacing:4px;margin-bottom:6px}
.login-box .sub{color:rgba(255,255,255,0.3);font-size:10px;letter-spacing:2px;margin-bottom:44px}
.pin-row{display:flex;gap:12px;justify-content:center;margin-bottom:16px}
.pin-input{width:60px;height:60px;text-align:center;font-size:26px;font-family:'Cormorant Garamond',serif;background:rgba(255,255,255,0.05);border:1px solid rgba(184,150,90,0.25);border-radius:14px;color:white;outline:none;transition:all 0.2s}
.pin-input:focus{border-color:var(--gold);background:rgba(184,150,90,0.08)}
.pin-error{color:#ff6b6b;font-size:11px;letter-spacing:1px;min-height:20px;margin-bottom:20px}
.btn-primary{width:100%;padding:17px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;border-radius:13px;color:#2a1f14;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;cursor:pointer;transition:all 0.2s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(184,150,90,0.35)}

/* MAIN LAYOUT */
.view{display:none}
.view.active{display:flex;flex-direction:column;min-height:100vh}

/* HEADER */
.header{background:linear-gradient(135deg,#0d0b18,#3a1f6b);padding:0 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);flex-shrink:0;height:64px}
.header-logo{font-family:'Cormorant Garamond',serif;color:white;font-size:22px;font-weight:300;letter-spacing:3px;margin-right:auto}
.header-logo span{color:var(--gold)}
.nav-btn{padding:10px 20px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:rgba(255,255,255,0.55);font-size:11px;font-weight:600;letter-spacing:1.5px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.nav-btn:hover{color:white;border-color:rgba(255,255,255,0.3)}
.nav-btn.active-tab{background:rgba(184,150,90,0.15);border-color:var(--gold);color:var(--gold)}
.conn-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;animation:blink 1.5s infinite;flex-shrink:0}
.conn-dot.off{background:#ff5252;animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}
.logout-btn{background:none;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.35);font-size:10px;letter-spacing:2px;padding:7px 14px;border-radius:8px;cursor:pointer}
.logout-btn:hover{color:white;border-color:rgba(255,255,255,0.4)}

/* STATS BAR */
.stats-bar{display:flex;gap:12px;padding:14px 24px;background:rgba(0,0,0,0.2);border-bottom:1px solid var(--border);flex-shrink:0}
.stat-pill{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 18px;display:flex;align-items:center;gap:10px}
.stat-pill .val{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:26px;line-height:1}
.stat-pill .lbl{color:rgba(255,255,255,0.25);font-size:9px;letter-spacing:2px}

/* PAGES */
.page{display:none;flex:1;overflow-y:auto}
.page.active{display:block}

/* COMMANDES EN COURS */
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:20px 24px}
.order-card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;animation:slideUp 0.3s ease;cursor:pointer;transition:border-color 0.2s}
.order-card:hover{border-color:rgba(184,150,90,0.5)}
.order-card.urgent{border-color:rgba(255,152,0,0.5);box-shadow:0 0 0 1px rgba(255,152,0,0.15)}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.oc-head{background:linear-gradient(135deg,rgba(107,63,160,0.3),rgba(184,150,90,0.07));padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.oc-table{font-family:'Cormorant Garamond',serif;font-size:20px;color:white}
.oc-table span{color:var(--gold)}
.oc-meta{text-align:right}
.oc-time{color:rgba(255,255,255,0.35);font-size:10px;letter-spacing:1px}
.oc-num{color:rgba(255,255,255,0.2);font-size:10px}
.oc-items{padding:12px 18px}
.oc-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.oc-item:last-child{border:none}
.oc-item-name{color:rgba(255,255,255,0.78);font-size:12px}
.oc-item-qty{background:rgba(184,150,90,0.14);color:var(--gold);font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px}
.oc-note{margin:2px 18px 8px;padding:9px 12px;background:rgba(184,150,90,0.06);border-left:2px solid var(--gold);color:rgba(255,255,255,0.4);font-size:11px;font-style:italic;border-radius:0 8px 8px 0}
.oc-foot{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border)}
.oc-total{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:22px}
.btn-payer{padding:12px 22px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;border-radius:11px;color:#2a1f14;font-size:11px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all 0.2s}
.btn-payer:hover{transform:scale(1.04)}
.empty-state{text-align:center;padding:80px 20px;color:rgba(255,255,255,0.12);grid-column:1/-1}
.empty-state .icon{font-size:52px;margin-bottom:14px;opacity:0.4}
.empty-state p{font-size:12px;letter-spacing:3px}

/* MODAL PAIEMENT */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(12px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-overlay.hidden{display:none}
.modal{background:#1a1730;border:1px solid rgba(184,150,90,0.25);border-radius:24px;width:100%;max-width:540px;overflow:hidden}
.modal-head{background:linear-gradient(135deg,#0d0b18,#3a1f6b);padding:20px 26px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.modal-head h3{font-family:'Cormorant Garamond',serif;color:white;font-size:24px;font-weight:300;letter-spacing:2px}
.modal-close{background:none;border:none;color:rgba(255,255,255,0.4);font-size:24px;cursor:pointer;padding:4px 8px}
.modal-close:hover{color:white}
.modal-body{padding:24px 26px}
.modal-items{margin-bottom:16px}
.mi-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;color:rgba(255,255,255,0.7)}
.mi-row:last-child{border:none}
.mi-row .qty{color:var(--gold);font-weight:600;margin-right:8px}
.modal-total{background:rgba(0,0,0,0.3);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.modal-total .label{color:rgba(255,255,255,0.4);font-size:11px;letter-spacing:2px}
.modal-total .amount{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:32px}
.paiement-label{color:rgba(255,255,255,0.35);font-size:10px;letter-spacing:3px;margin-bottom:12px}
.paiement-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.pay-btn{padding:20px;border:2px solid rgba(255,255,255,0.1);border-radius:14px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.6);font-size:13px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:8px}
.pay-btn .icon{font-size:28px}
.pay-btn:hover{border-color:var(--gold);color:white;background:rgba(184,150,90,0.08)}
.pay-btn.selected{border-color:var(--gold);background:rgba(184,150,90,0.15);color:var(--gold)}
.btn-valider{width:100%;padding:18px;background:linear-gradient(135deg,var(--green),#2ecc71);border:none;border-radius:13px;color:white;font-size:13px;font-weight:700;letter-spacing:3px;cursor:pointer;transition:all 0.2s}
.btn-valider:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(39,174,96,0.4)}
.btn-valider:disabled{opacity:0.35;cursor:not-allowed;transform:none}

/* HISTORIQUE */
.histo-header{padding:20px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.histo-header h3{font-family:'Cormorant Garamond',serif;color:white;font-size:22px;font-weight:300;letter-spacing:3px}
.period-btn{padding:8px 18px;border:1px solid var(--border);background:var(--card);border-radius:10px;color:rgba(255,255,255,0.4);font-size:10px;font-weight:600;letter-spacing:2px;cursor:pointer;transition:all 0.2s}
.period-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(184,150,90,0.1)}
.histo-summary{display:flex;gap:12px;padding:12px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
.hs-pill{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;flex:1;text-align:center}
.hs-pill .v{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:22px}
.hs-pill .l{color:rgba(255,255,255,0.25);font-size:9px;letter-spacing:2px}
.histo-list{padding:16px 24px}
.histo-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:border-color 0.2s}
.histo-item:hover{border-color:rgba(184,150,90,0.4)}
.hi-num{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:22px;min-width:52px}
.hi-info{flex:1}
.hi-table{color:white;font-size:13px;font-weight:600;margin-bottom:3px}
.hi-time{color:rgba(255,255,255,0.3);font-size:11px}
.hi-total{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:22px;text-align:right}
.hi-mode{font-size:10px;letter-spacing:1px;padding:3px 10px;border-radius:6px;text-align:center;margin-top:4px}
.hi-mode.carte{background:rgba(52,152,219,0.15);color:#5dade2}
.hi-mode.especes{background:rgba(39,174,96,0.15);color:#58d68d}

/* TICKET IMPRESSION */
@media print{
  body>*{display:none!important}
  #ticket-print{display:block!important}
}
#ticket-print{display:none;font-family:'Courier New',monospace;font-size:12px;width:280px;padding:10px;color:#000}
#ticket-print .t-center{text-align:center}
#ticket-print .t-bold{font-weight:bold}
#ticket-print .t-line{border-top:1px dashed #000;margin:6px 0}
#ticket-print .t-row{display:flex;justify-content:space-between}
#ticket-print .t-big{font-size:16px;font-weight:bold}

/* OVERLAYS */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(135deg,#219a52,#27ae60);color:white;padding:13px 22px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:1px;z-index:9999;transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 8px 24px rgba(0,0,0,0.5);max-width:88vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{background:linear-gradient(135deg,#c0392b,#e74c3c)}
.toast.info{background:linear-gradient(135deg,#2471a3,#2e86c1)}
.loading-overlay{position:fixed;inset:0;background:rgba(15,13,26,0.85);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9000;transition:opacity 0.3s}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.spinner{width:44px;height:44px;border:3px solid rgba(184,150,90,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay p{color:rgba(255,255,255,0.4);font-size:10px;letter-spacing:3px}
</style>
</head>
<body>

<!-- TICKET IMPRESSION (caché, visible seulement à l'impression) -->
<div id="ticket-print"></div>

<!-- OVERLAYS -->
<div class="loading-overlay hidden" id="loadingOverlay"><div class="spinner"></div><p id="loadingText">CHARGEMENT...</p></div>
<div class="toast" id="toast"></div>

<!-- MODAL PAIEMENT -->
<div class="modal-overlay hidden" id="payModal">
  <div class="modal">
    <div class="modal-head">
      <h3>RÈGLEMENT</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-items" id="modalItems"></div>
      <div class="modal-total">
        <div>
          <div class="label">TOTAL À RÉGLER</div>
        </div>
        <div class="amount" id="modalTotal">0€</div>
      </div>
      <div class="paiement-label">MODE DE PAIEMENT</div>
      <div class="paiement-btns">
        <button class="pay-btn" id="btnCarte" onclick="selectPay('carte')">
          <span class="icon">💳</span>
          CARTE
        </button>
        <button class="pay-btn" id="btnEspeces" onclick="selectPay('especes')">
          <span class="icon">💵</span>
          ESPÈCES
        </button>
      </div>
      <button class="btn-valider" id="btnValider" onclick="validerPaiement()" disabled>✓ VALIDER ET IMPRIMER</button>
    </div>
  </div>
</div>

<!-- LOGIN -->
<!-- MAIN CAISSE -->
<div id="view-main" class="view active">
  <div class="header">
    <div class="header-logo">THE <span>PALM</span> &nbsp;·&nbsp; <span style="font-size:14px;letter-spacing:2px;color:rgba(255,255,255,0.4)">CAISSE</span></div>
    <button class="nav-btn active-tab" id="tabCommandes" onclick="switchTab('commandes')">🔔 EN COURS</button>
    <button class="nav-btn" id="tabHistorique" onclick="switchTab('historique')">📋 HISTORIQUE</button>
    <div class="conn-dot" id="connDot"></div>
    <button class="logout-btn" onclick="logout()">QUITTER</button>
  </div>

  <div class="stats-bar">
    <div class="stat-pill"><div class="val" id="statPending">0</div><div class="lbl">EN ATTENTE</div></div>
    <div class="stat-pill"><div class="val" id="statToday">0</div><div class="lbl">COMMANDES</div></div>
    <div class="stat-pill"><div class="val" id="statCA">0€</div><div class="lbl">CA DU JOUR</div></div>
  </div>

  <!-- PAGE COMMANDES -->
  <div class="page active" id="pageCommandes">
    <div class="orders-grid" id="ordersGrid"></div>
  </div>

  <!-- PAGE HISTORIQUE -->
  <div class="page" id="pageHistorique">
    <div class="histo-header">
      <h3>HISTORIQUE</h3>
      <button class="period-btn active" id="btnAujourd" onclick="setPeriod('today')">AUJOURD'HUI</button>
      <button class="period-btn" id="btn7j" onclick="setPeriod('7days')">7 DERNIERS JOURS</button>
    </div>
    <div class="histo-summary">
      <div class="hs-pill"><div class="v" id="hsTotalCmd">0</div><div class="l">COMMANDES</div></div>
      <div class="hs-pill"><div class="v" id="hsTotalCA">0€</div><div class="l">CA TOTAL</div></div>
      <div class="hs-pill"><div class="v" id="hsMoy">0€</div><div class="l">MOYENNE / CMD</div></div>
    </div>
    <div class="histo-list" id="histoList"></div>
  </div>
</div>

<script>
const SUPABASE_URL='https://maqtghwrzztscibzrbeh.supabase.co';
const SUPABASE_KEY='sb_publishable_OnTJml3M6Y2ouPqYAj_W6A_U19BOQSZ';
const PIN='1234';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let pendingOrders=[],channel=null,currentOrder=null,selectedPayMode=null,histoPeriod='today';
let toastTimer=null;

// ── DÉMARRAGE AUTO ──
async function init(){
  showLoading('CONNEXION...');
  await loadPending();
  await loadStats();
  startRealtime();
  hideLoading();
}

function logout(){
  if(channel){channel.unsubscribe();channel=null;}
  pendingOrders=[];
  location.reload();
}

// ── DATA ──
async function loadPending(){
  const today=new Date();today.setHours(0,0,0,0);
  const{data,error}=await sb.from('orders').select('*').eq('status','pending').gte('created_at',today.toISOString()).order('created_at',{ascending:true});
  if(!error){pendingOrders=data||[];renderOrders();}
  setConn(!error);
}
async function loadStats(){
  const today=new Date();today.setHours(0,0,0,0);
  const{data}=await sb.from('orders').select('total,status').gte('created_at',today.toISOString());
  const all=data||[];
  document.getElementById('statPending').textContent=all.filter(o=>o.status==='pending').length;
  document.getElementById('statToday').textContent=all.length;
  document.getElementById('statCA').textContent=all.filter(o=>o.status==='done').reduce((s,o)=>s+(o.total||0),0)+'€';
}
function startRealtime(){
  if(channel)channel.unsubscribe();
  channel=sb.channel('caisse-live')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},p=>{
      if(p.new.status==='pending'){
        pendingOrders.push(p.new);
        playNotif();
        showToast('🔔 NOUVELLE COMMANDE — TABLE '+p.new.table_number);
        renderOrders();loadStats();
      }
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders'},p=>{
      pendingOrders=pendingOrders.filter(o=>o.id!==p.new.id);
      renderOrders();loadStats();
    })
    .subscribe(s=>setConn(s==='SUBSCRIBED'));
}
function setConn(ok){
  const d=document.getElementById('connDot');
  if(d)d.className='conn-dot'+(ok?'':' off');
}

// ── RENDER COMMANDES ──
function renderOrders(){
  const grid=document.getElementById('ordersGrid');
  if(!pendingOrders.length){
    grid.innerHTML='<div class="empty-state"><div class="icon">🔔</div><p>EN ATTENTE DE COMMANDES...</p></div>';
    return;
  }
  grid.innerHTML=pendingOrders.map(o=>{
    const items=Array.isArray(o.items)?o.items:[];
    const t=new Date(o.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    const num='#'+String(o.order_number).padStart(3,'0');
    const age=(Date.now()-new Date(o.created_at).getTime())/60000;
    return `<div class="order-card${age>10?' urgent':''}" onclick="openPayModal('${o.id}')">
      <div class="oc-head">
        <div class="oc-table">TABLE <span>#${o.table_number}</span></div>
        <div class="oc-meta"><div class="oc-time">⏰ ${t}${age>10?' ⚠️':''}</div><div class="oc-num">${num}</div></div>
      </div>
      <div class="oc-items">${items.map(i=>`<div class="oc-item"><span class="oc-item-name">${i.name}</span><span class="oc-item-qty">x${i.qty}</span></div>`).join('')}</div>
      ${o.note?`<div class="oc-note">📝 ${o.note}</div>`:''}
      <div class="oc-foot">
        <div class="oc-total">${o.total}€</div>
        <button class="btn-payer" onclick="event.stopPropagation();openPayModal('${o.id}')">RÉGLER →</button>
      </div>
    </div>`;
  }).join('');
}

// ── MODAL PAIEMENT ──
function openPayModal(id){
  currentOrder=pendingOrders.find(o=>o.id===id);
  if(!currentOrder)return;
  selectedPayMode=null;
  document.getElementById('btnCarte').classList.remove('selected');
  document.getElementById('btnEspeces').classList.remove('selected');
  document.getElementById('btnValider').disabled=true;
  const items=Array.isArray(currentOrder.items)?currentOrder.items:[];
  document.getElementById('modalItems').innerHTML=`
    <div class="mi-row" style="color:rgba(255,255,255,0.35);font-size:10px;letter-spacing:2px;padding-bottom:10px">TABLE #${currentOrder.table_number} &nbsp;·&nbsp; #${String(currentOrder.order_number).padStart(3,'0')}</div>
    ${items.map(i=>`<div class="mi-row"><span><span class="qty">x${i.qty}</span>${i.name}</span><span>${i.qty*i.price}€</span></div>`).join('')}
    ${currentOrder.note?`<div class="mi-row" style="color:rgba(255,255,255,0.3);font-style:italic;font-size:11px">📝 ${currentOrder.note}</div>`:''}
  `;
  document.getElementById('modalTotal').textContent=currentOrder.total+'€';
  document.getElementById('payModal').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('payModal').classList.add('hidden');
  currentOrder=null;selectedPayMode=null;
}
function selectPay(mode){
  selectedPayMode=mode;
  document.getElementById('btnCarte').classList.toggle('selected',mode==='carte');
  document.getElementById('btnEspeces').classList.toggle('selected',mode==='especes');
  document.getElementById('btnValider').disabled=false;
}
async function validerPaiement(){
  if(!currentOrder||!selectedPayMode)return;
  const btn=document.getElementById('btnValider');
  btn.disabled=true;btn.textContent='VALIDATION...';
  try{
    const{error}=await sb.from('orders').update({status:'done',payment_method:selectedPayMode}).eq('id',currentOrder.id);
    if(error)throw error;
    imprimerTicket(currentOrder,selectedPayMode);
    pendingOrders=pendingOrders.filter(o=>o.id!==currentOrder.id);
    closeModal();
    renderOrders();
    await loadStats();
    showToast('✅ Commande réglée — '+selectedPayMode.toUpperCase(),'success');
    if(histoPeriod)await loadHistorique();
  }catch(e){
    showToast('❌ Erreur. Réessayez.','error');
  }finally{
    btn.disabled=false;btn.textContent='✓ VALIDER ET IMPRIMER';
  }
}

// ── IMPRESSION TICKET ──
function imprimerTicket(order,mode){
  const items=Array.isArray(order.items)?order.items:[];
  const now=new Date();
  const dateStr=now.toLocaleDateString('fr-FR');
  const timeStr=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const num='#'+String(order.order_number).padStart(3,'0');
  const modeStr=mode==='carte'?'💳 CARTE BANCAIRE':'💵 ESPÈCES';
  const ticketEl=document.getElementById('ticket-print');
  ticketEl.innerHTML=`
    <div class="t-center t-bold" style="font-size:16px;letter-spacing:2px">THE PALM</div>
    <div class="t-center" style="font-size:10px">RESTAURANT & LOUNGE</div>
    <div class="t-line"></div>
    <div class="t-center">TABLE N°${order.table_number} &nbsp; ${num}</div>
    <div class="t-center" style="font-size:10px">${dateStr} ${timeStr}</div>
    <div class="t-line"></div>
    ${items.map(i=>`<div class="t-row"><span>${i.name}</span><span>${i.qty} x ${i.price}€</span></div>`).join('')}
    <div class="t-line"></div>
    <div class="t-row t-bold t-big"><span>TOTAL</span><span>${order.total}€</span></div>
    <div class="t-line"></div>
    <div class="t-center" style="font-size:10px">${modeStr}</div>
    <div class="t-line"></div>
    <div class="t-center" style="font-size:10px">Merci de votre visite !</div>
    <div class="t-center" style="font-size:9px">The Palm Restaurant & Lounge</div>
    <br><br><br>
  `;
  window.print();
}

// ── HISTORIQUE ──
function switchTab(tab){
  document.getElementById('pageCommandes').classList.toggle('active',tab==='commandes');
  document.getElementById('pageHistorique').classList.toggle('active',tab==='historique');
  document.getElementById('tabCommandes').classList.toggle('active-tab',tab==='commandes');
  document.getElementById('tabHistorique').classList.toggle('active-tab',tab==='historique');
  if(tab==='historique')loadHistorique();
}
function setPeriod(p){
  histoPeriod=p;
  document.getElementById('btnAujourd').classList.toggle('active',p==='today');
  document.getElementById('btn7j').classList.toggle('active',p==='7days');
  loadHistorique();
}
async function loadHistorique(){
  showLoading('CHARGEMENT...');
  const from=new Date();
  if(histoPeriod==='today')from.setHours(0,0,0,0);
  else from.setDate(from.getDate()-7);
  const{data,error}=await sb.from('orders').select('*').eq('status','done').gte('created_at',from.toISOString()).order('created_at',{ascending:false});
  hideLoading();
  if(error||!data)return;
  const total=data.reduce((s,o)=>s+(o.total||0),0);
  const moy=data.length?Math.round(total/data.length):0;
  document.getElementById('hsTotalCmd').textContent=data.length;
  document.getElementById('hsTotalCA').textContent=total+'€';
  document.getElementById('hsMoy').textContent=moy+'€';
  const list=document.getElementById('histoList');
  if(!data.length){list.innerHTML='<div style="text-align:center;color:rgba(255,255,255,0.2);padding:40px;font-size:12px;letter-spacing:2px">AUCUNE COMMANDE</div>';return;}
  list.innerHTML=data.map(o=>{
    const t=new Date(o.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    const d=new Date(o.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
    const num='#'+String(o.order_number).padStart(3,'0');
    const mode=o.payment_method||'';
    return `<div class="histo-item" onclick="reimprimerTicket('${o.id}')">
      <div class="hi-num">${num}</div>
      <div class="hi-info">
        <div class="hi-table">TABLE #${o.table_number}</div>
        <div class="hi-time">${d} à ${t}</div>
      </div>
      <div>
        <div class="hi-total">${o.total}€</div>
        ${mode?`<div class="hi-mode ${mode}">${mode==='carte'?'💳 CARTE':'💵 ESPÈCES'}</div>`:''}
      </div>
    </div>`;
  }).join('');
}
async function reimprimerTicket(id){
  const{data,error}=await sb.from('orders').select('*').eq('id',id).single();
  if(!error&&data)imprimerTicket(data,data.payment_method||'');
}

// ── UTILS ──
function playNotif(){
  try{
    const ctx=new AudioContext();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.setValueAtTime(880,ctx.currentTime);
    o.frequency.setValueAtTime(1100,ctx.currentTime+0.12);
    g.gain.setValueAtTime(0.35,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
    o.start(ctx.currentTime);o.stop(ctx.currentTime+0.5);
  }catch(e){}
}
function showLoading(t){document.getElementById('loadingText').textContent=t||'...';document.getElementById('loadingOverlay').classList.remove('hidden');}
function hideLoading(){document.getElementById('loadingOverlay').classList.add('hidden');}
function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(type==='error'?' error':type==='info'?' info':'')+' show';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3500);
}
init();
</script>
